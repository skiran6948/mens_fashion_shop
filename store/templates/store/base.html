<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Men's Fashion Store{% endblock %}</title>

    <!-- You can add CSS later here -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        header, footer {
            background-color: #222;
            color: white;
            padding: 10px 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 20px;
        }
    </style>
</head>

<body>
    <!-- 🔹 Header section -->
    <header>
        <h1>Men's Fashion Store 👕</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/shop/">Shop</a>
            <a href="/cart/">Cart 🛒</a>
            {% if user.is_authenticated %}
            <a href="/my-orders/">My Orders</a>
            <a href="/accounts/logout/">Logout ({{ user.username }})</a>
            {% else %}
            <a href="/accounts/login/">Login</a>
            <a href="/accounts/register/">Register</a>
            {% endif %}
        </nav>
    </header>

    <!-- 🔹 Page content will load here -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- 🔹 Footer section -->
    <footer>
        <p>&copy; 2025 Men's Fashion Store. All rights reserved.</p>
    </footer>
</body>
</html>
